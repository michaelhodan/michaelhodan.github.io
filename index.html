<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>michael — copywriter</title>
<meta name="description" content="Copywriter. Working with a small, closed list of clients, by referral.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c;
    --rule: #1f1f1f;
    --text: #ededed;
    --muted: #6e6e6e;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    color: var(--text);
    font-family: 'IBM Plex Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-weight: 400;
    font-size: 14px;
    line-height: 1.65;
    letter-spacing: 0;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background: linear-gradient(180deg, #0a0a0a 0%, #141414 100%);
    background-attachment: fixed;
  }

  .page {
    min-height: 100vh;
    max-width: 720px;
    margin: 0 auto;
    padding: 2.5rem 2rem 2.5rem;
    display: flex;
    flex-direction: column;
  }

  .top-space { flex: 1.6; }

  /* — Mark (first name, small, top-left) — */
  .mark {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-bottom: 8rem;
    opacity: 0;
    animation: fade .8s ease .1s forwards;
  }

  /* — Hero: two sentences — */
  .hero {
    font-size: 1.25rem;
    line-height: 1.55;
    color: var(--text);
    max-width: 36rem;
    opacity: 0;
    animation: rise .9s cubic-bezier(.2,.7,.2,1) .3s forwards;
  }
  .hero p { margin-bottom: 0.9rem; }
  .hero p:last-child { margin-bottom: 0; }

  /* — Contact block, leads after hero — */
  .contact {
    margin-top: 4rem;
    opacity: 0;
    animation: rise .9s cubic-bezier(.2,.7,.2,1) .55s forwards;
  }

  .contact .label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: lowercase;
    margin-bottom: 0.5rem;
  }

  .contact a {
    font-size: 15px;
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1px;
    transition: border-color .25s ease, color .25s ease;
  }
  .contact a:hover {
    color: #ffffff;
    border-bottom-color: var(--text);
  }

  /* — Footer pushed to bottom — */
  footer {
    margin-top: auto;
    padding-top: 4rem;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
  }

  @keyframes fade { to { opacity: 1; } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .page { padding: 2rem 1.5rem; }
    .mark { margin-bottom: 5rem; }
    .hero { font-size: 1.1rem; }
    footer { flex-direction: column; gap: 0.4rem; }
  }
</style>
</head>
<body>
  <main class="page">

    <div class="top-space"></div>

    <section class="hero">
      <p>I write copy for a small, closed list of clients, taken on by referral.</p>
      <p>If there's a project worth doing well, start a conversation below.</p>
    </section>

    <section class="contact">
      <span class="label">— get in touch</span>
      <a href="mailto:hello@michaelhodan.com">hello@michaelhodan.com</a>
    </section>

    <footer>
      <span>2026</span>
    </footer>

  </main>
</body>
</html>
